name: Agent Contract Validation

on:
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/agent-contract-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/agent-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-agent-contract:
    name: Compile, import boundary and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout DGM-MAT-Agents
        uses: actions/checkout@v4

      - name: Checkout public DGM-Contracts
        uses: actions/checkout@v4
        with:
          repository: AndreVazao/DGM-Contracts
          ref: main
          path: DGM-Contracts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install only package and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./DGM-Contracts -e . pytest

      - name: Compile agent package and tests
        run: python -m compileall -q src tests

      - name: Run focused agent contract tests
        run: python -m pytest -q tests
