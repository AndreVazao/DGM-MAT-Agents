[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgm-mat-agents"
version = "0.1.0"
description = "Standalone DGM-MAT agent implementations"
requires-python = ">=3.12"
dependencies = ["dgm-contracts>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
